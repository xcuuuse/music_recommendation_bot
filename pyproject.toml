[project]
name = "music-recommendation-bot"
version = "0.1.0"
description = "Telegram-бот, который рекомендует музыкальные альбомы на основе графа Neo4j и эмбеддингов"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.31,<4",
    "neo4j>=6.4,<7",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.16,<3",
    "numpy>=2.5,<3",
    "pandas>=3.1,<4",
    "sentence-transformers>=6.2,<7",
    "torch>=2.14",
]

[dependency-groups]
dev = [
    "ruff>=0.14",
    "mypy>=1.18",
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
]

[tool.uv]
package = false


[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"