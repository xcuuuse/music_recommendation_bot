services:
  neo4j:
    image: neo4j:5.26-community
    container_name: music_neo4j
    restart: unless-stopped
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD}
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_PASSWORD}\" 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  bot:
    build: .
    container_name: music_bot
    restart: unless-stopped
    env_file: .env
    environment:
      - NEO4J_URI=bolt://neo4j:7687
    volumes:
      - hf_cache:/cache/huggingface
    depends_on:
      neo4j:
        condition: service_healthy

volumes:
  neo4j_data:
  hf_cache: